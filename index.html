  <script>
    window.AGENTHUB_TAILWIND_CONFIG = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            canvas: '#f5efe5',
            ink: '#18181b',
            ember: '#d97706',
            moss: '#3f6212',
            sea: '#155e75',
            berry: '#9f1239'
          },
          boxShadow: {
            panel: '0 20px 45px -24px rgba(24, 24, 27, 0.28)'
          }
        }
      }
    };
    window.tailwind = window.tailwind || {};
    window.tailwind.config = window.AGENTHUB_TAILWIND_CONFIG;

    // Aplicar tema antes de cargar estilos evita parpadeos y asegura clases dark en toda la UI.
    (function applyInitialTheme() {
      const THEME_STORAGE_KEY = 'agenthub-theme';
      let storedTheme = null;

      try {
        storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
      } catch (error) {
        storedTheme = null;
      }

      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const shouldUseDark = storedTheme ? storedTheme === 'dark' : prefersDark;
      document.documentElement.classList.toggle('dark', shouldUseDark);
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Reafirma la configuracion para entornos donde el CDN inicializa en dos fases.
    if (window.tailwind) {
      window.tailwind.config = window.AGENTHUB_TAILWIND_CONFIG;

      if (typeof window.tailwind.refresh === 'function') {
        window.tailwind.refresh();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.tailwind && typeof window.tailwind.refresh === 'function') {
        window.tailwind.refresh();
      }
    });
  </script>

    function getStoredTheme() {
      try {
        const storedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        return storedTheme === 'dark' || storedTheme === 'light' ? storedTheme : null;
      } catch (error) {
        return null;
      }
    }

    function setTheme(theme, persist = true) {
      const normalizedTheme = theme === 'dark' ? 'dark' : 'light';
      const isDark = normalizedTheme === 'dark';

      if (window.tailwind) {
        window.tailwind.config = window.AGENTHUB_TAILWIND_CONFIG;

        if (typeof window.tailwind.refresh === 'function') {
          window.tailwind.refresh();
        }
      }

      document.documentElement.classList.toggle('dark', isDark);
      themeToggle.setAttribute('aria-pressed', String(isDark));
      themeToggle.setAttribute('aria-label', isDark ? 'Activar modo claro' : 'Activar modo oscuro');
      themeToggleLabel.textContent = isDark ? 'Modo claro' : 'Modo oscuro';

      if (themeToggleIcon) {
        themeToggleIcon.innerHTML = isDark
          ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4"><path d="M12 2a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 12 2Zm0 16.25a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V19a.75.75 0 0 1 .75-.75ZM4 11.25a.75.75 0 0 1 0 1.5H2.5a.75.75 0 0 1 0-1.5H4Zm17.5 0a.75.75 0 0 1 0 1.5H20a.75.75 0 0 1 0-1.5h1.5ZM6.04 5.03a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 1 1-1.06 1.06L6.04 6.09a.75.75 0 0 1 0-1.06Zm10.8 10.8a.75.75 0 0 1 1.06 0l1.06 1.06a.75.75 0 0 1-1.06 1.06l-1.06-1.06a.75.75 0 0 1 0-1.06ZM18.97 5.03a.75.75 0 0 1 0 1.06l-1.06 1.06a.75.75 0 0 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0ZM8.16 15.83a.75.75 0 0 1 0 1.06L7.1 17.95a.75.75 0 0 1-1.06-1.06l1.06-1.06a.75.75 0 0 1 1.06 0ZM12 6.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Z"/></svg>`
          : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-4 w-4"><path d="M21.64 13.01A9 9 0 1 1 10.99 2.36a.75.75 0 0 1 .8.99 7 7 0 0 0 8.22 8.22.75.75 0 0 1 .99.8Z"/></svg>`;
      }

      if (persist) {
        try {
          localStorage.setItem(THEME_STORAGE_KEY, normalizedTheme);
        } catch (error) {
          // Ignorar errores de storage para no bloquear la UI.
        }
      }
    }

    function initTheme() {
      const savedTheme = getStoredTheme();
      const hasMatchMedia = typeof window.matchMedia === 'function';
      const preferredDark = hasMatchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const initialTheme = savedTheme || (preferredDark ? 'dark' : 'light');
      setTheme(initialTheme, false);

      if (!hasMatchMedia) {
        return;
      }

      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
      const syncWithSystem = (event) => {
        if (!getStoredTheme()) {
          setTheme(event.matches ? 'dark' : 'light', false);
        }
      };

      if (typeof mediaQuery.addEventListener === 'function') {
        mediaQuery.addEventListener('change', syncWithSystem);
      } else if (typeof mediaQuery.addListener === 'function') {
        mediaQuery.addListener(syncWithSystem);
      }
    }

    function findById(collection, id) {

            </div>
            <p>${error.summary}</p>
            <div class="rounded-[1.5rem] bg-stone-100 p-4 font-mono text-xs leading-6 text-stone-700 dark:bg-stone-950 dark:text-stone-200">${error.trace}</div>
          </div>
        `);
      }

      if (action === 'error-resolve') {
        state.errors = state.errors.map((error) => error.id === numericId ? { ...error, resolved: true } : error);
        renderSection();
      }
    }

    document.addEventListener('click', (event) => {
      const navButton = event.target.closest('[data-nav]');
      if (navButton) {
        state.activeSection = navButton.dataset.nav;
        closeDropdown();
        renderSection();
        return;
      }

      const dropdownTrigger = event.target.closest('[data-dropdown-trigger]');
      if (dropdownTrigger) {
        const key = dropdownTrigger.dataset.dropdownTrigger;
        state.openDropdown = state.openDropdown === key ? null : key;
        renderSection();
        return;
      }

      const actionButtonTarget = event.target.closest('[data-action]');
      if (actionButtonTarget) {
        handleAction(actionButtonTarget.dataset.action, actionButtonTarget.dataset.id);
        return;
      }

      const agentToggle = event.target.closest('[data-toggle-agent]');
      if (agentToggle) {
        const agentId = Number(agentToggle.dataset.toggleAgent);
        state.expandedAgents[agentId] = !state.expandedAgents[agentId];
        renderSection();
        return;
      }

      const closeModalButton = event.target.closest('[data-close-modal]');
      if (closeModalButton) {
        closeModal();
        return;
      }

      const saveAgentButton = event.target.closest('[data-save-agent]');
      if (saveAgentButton) {
        const agentId = Number(saveAgentButton.dataset.saveAgent);
        const textarea = document.querySelector('[data-agent-prompt="' + agentId + '"]');
        state.agents = state.agents.map((agent) => agent.id === agentId ? { ...agent, prompt: textarea.value } : agent);
        closeModal();
        renderSection();
        return;
      }

      if (!event.target.closest('[data-dropdown-menu]')) {
        closeDropdown();
      }

      if (event.target.hasAttribute('data-backdrop')) {
        closeModal();
      }
    });

    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.classList.contains('dark');
      setTheme(isDark ? 'light' : 'dark');
    });

    initTheme();
    renderSidebar();
    renderSection();
  </script>
</body>
</html>
